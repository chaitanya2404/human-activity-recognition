name: CI

# This repo has no test suite (it is a notebook + a data-download script), so
# CI verifies the things that can honestly be verified:
#   * the pinned dependencies actually install
#   * download_data.py lints, byte-compiles, imports, and its CLI works
#   * the committed notebook is a valid, error-free nbformat document
#
# Actually executing the notebook downloads ~65 MB from the UCI archive and
# trains two MLPs, so that lives in a separate job that only runs on demand or
# on a weekly schedule (see the `notebook-execution` job below).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_notebook:
        description: "Also execute the full notebook (downloads the dataset, trains both MLPs)"
        type: boolean
        default: false
  schedule:
    # Weekly, Mondays 06:00 UTC — catches the UCI archive going away or the
    # pinned dependency stack breaking the notebook end to end.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  # event_name is part of the key so that a push to master cannot cancel an
  # in-flight scheduled notebook run.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the version the committed notebook was executed with
        # (metadata.language_info.version == 3.12.13).
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install lint tooling
        # Pinned: ruff's default rule set changes between releases, and an
        # unpinned upgrade would fail CI on a push that changed nothing.
        run: pip install ruff==0.16.3

      - name: Lint download_data.py (ruff)
        run: ruff check download_data.py

      - name: Byte-compile Python sources
        run: python -m compileall -q download_data.py

      - name: Import download_data (no network calls at import time)
        run: python -c "import download_data; print('imported OK; dataset URL =', download_data.DATASET_URL)"

      - name: download_data.py CLI smoke test
        run: python download_data.py --help

      - name: Validate notebook with nbformat
        run: |
          python - <<'PY'
          import sys
          import nbformat

          PATH = "human_activity_recognition.ipynb"

          nb = nbformat.read(PATH, as_version=4)
          nbformat.validate(nb)          # raises ValidationError on a bad notebook

          code_cells = [c for c in nb.cells if c.cell_type == "code"]
          if not code_cells:
              sys.exit(f"{PATH}: no code cells found")

          # A committed notebook should not carry a stored traceback from a
          # failed run.
          errors = [
              (i, out.get("ename"))
              for i, cell in enumerate(nb.cells)
              for out in cell.get("outputs", [])
              if out.get("output_type") == "error"
          ]
          if errors:
              sys.exit(f"{PATH}: cells with stored error output: {errors}")

          print(
              f"{PATH}: valid nbformat v{nb.nbformat}.{nb.nbformat_minor}, "
              f"{len(nb.cells)} cells ({len(code_cells)} code), no error outputs"
          )
          PY

  notebook-execution:
    name: Execute notebook end to end
    # Expensive (downloads the ~65 MB UCI archive and trains two MLPs), so it
    # is deliberately kept off the push/PR path.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_notebook)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download the UCI HAR dataset
        run: python download_data.py

      - name: Execute the notebook
        # The notebook carries no kernelspec metadata, so the kernel name has
        # to be given explicitly.
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.kernel_name=python3 \
            --ExecutePreprocessor.timeout=1800 \
            --output executed.ipynb \
            --output-dir "${RUNNER_TEMP}" \
            human_activity_recognition.ipynb

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: ${{ runner.temp }}/executed.ipynb
          if-no-files-found: warn
