# Lint configuration for CI (.github/workflows/ci.yml runs `ruff check download_data.py`).
#
# Without this file ruff 0.16.3 enables its full default rule set (~414 rules),
# which includes EXE001 ("shebang is present but file is not executable").  That
# makes the lint step's result depend on a filesystem permission bit rather than
# on the code: a Windows clone, `core.fileMode = false`, or a zip download would
# strip the exec bit off download_data.py and turn CI red for no real reason.
#
# Selecting the rule set explicitly makes the lint deterministic and
# mode-independent -- it is exactly the set the workflow comment describes.
[lint]
select = ["E4", "E7", "E9", "F"]
